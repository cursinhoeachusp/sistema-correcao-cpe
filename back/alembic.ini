# Alembic configuration for the CPE OMR data package.
# The actual database URL is resolved at runtime in data/migrations/env.py from
# the CPE_DATABASE_URL environment variable (SQLite default), so the value here
# is only a placeholder and is overridden in env.py.
[alembic]
script_location = data/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///cpe_omr.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
