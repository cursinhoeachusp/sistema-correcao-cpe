services:
  api:
    build:
      context: ./back
      dockerfile: Dockerfile
    container_name: cpe-api
    environment:
      CPE_DATABASE_URL: sqlite:///data/cpe_omr.db
      CPE_API_HOST: 0.0.0.0
      CPE_API_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./back:/app:rw
      - sqlite-data:/app/data
    restart: unless-stopped

  dashboard:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: cpe-dashboard
    environment:
      CPE_API_URL: http://api:8001
    depends_on:
      - api
    ports:
      - "8501:8501"
    volumes:
      - ./front:/app:rw
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: cpe-nginx
    depends_on:
      - api
      - dashboard
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  sqlite-data:
